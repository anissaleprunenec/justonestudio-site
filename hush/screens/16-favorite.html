<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hush — Favoris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/hush.css">
<script src="../js/transitions.js"></script>
<style>
  .favorites { padding: 64px var(--gutter) 24px; }
  .favorites .results { display: grid; gap: 12px; margin-top: 16px; }
</style>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body>
<main class="screen screen--gray screen--app">
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons"><svg><use href="../assets/icons.svg#sb-signal"/></svg><svg><use href="../assets/icons.svg#sb-wifi"/></svg><svg><use href="../assets/icons.svg#sb-battery"/></svg></span>
  </div>

  <section class="favorites">
    <div class="chips" role="group" aria-label="Catégorie">
      <button class="btn btn--sm" aria-pressed="true" data-filter="all">Tout</button>
      <button class="btn btn--sm" aria-pressed="false" data-filter="hotel">Hôtels</button>
      <button class="btn btn--sm" aria-pressed="false" data-filter="resort">Resorts</button>
      <button class="btn btn--sm" aria-pressed="false" data-filter="restaurant">Restaurants</button>
      <button class="btn btn--sm" aria-pressed="false" data-filter="guide">Guides</button>
    </div>

    <div class="results" data-list="favorites"></div>
    <div class="empty" data-empty="favorites" hidden>
      <span class="empty__art"><svg class="i"><use href="../assets/icons.svg#sol-heart-linear"/></svg></span>
      <h2>Pas encore de coup de cœur</h2>
      <p>Touche le cœur sur une villa, un resort ou une visite pour la retrouver ici.</p>
      <a class="btn btn--sm" href="15-explore.html">Explorer Bali</a>
    </div>
  </section>

  <nav class="navbar" aria-label="Navigation principale">
    <ul>
      <li><a href="06-home.html"><svg class="i"><use href="../assets/icons.svg#sol-home-linear"/></svg>Accueil</a></li>
      <li><a href="13-history.html"><svg class="i"><use href="../assets/icons.svg#sol-suitcase-linear"/></svg>Voyages</a></li>
      <li><a href="15-explore.html"><svg class="i"><use href="../assets/icons.svg#sol-compass-linear"/></svg>Explorer</a></li>
      <li><a href="16-favorite.html" aria-current="page"><svg class="i"><use href="../assets/icons.svg#sol-heart-duo"/></svg>Favoris</a></li>
      <li><a href="17-profile.html"><svg class="i"><use href="../assets/icons.svg#sol-user-linear"/></svg>Profil</a></li>
    </ul>
    <span class="home-indicator"></span>
  </nav>
</main>
<script src="../js/hush.js"></script>
</body>
</html>
