<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hush — Mot de passe oublié</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/hush.css">
<script src="../js/transitions.js"></script>
<style>
  .forgot { display: flex; flex-direction: column; min-height: 852px; padding: 64px var(--gutter) 0; }
  .forgot .empty__art { margin: 48px 0 20px; }
  .forgot h2 { font-size: 24px; line-height: 32px; font-weight: 600; }
  .forgot > p { margin: 8px 0 28px; color: var(--gray-700); }
  .forgot .sheet__cta { padding-left: 0; padding-right: 0; }
</style>
</head>
<body>
<main class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="statusbar__icons"><svg><use href="../assets/icons.svg#sb-signal"/></svg><svg><use href="../assets/icons.svg#sb-wifi"/></svg><svg><use href="../assets/icons.svg#sb-battery"/></svg></span>
  </div>

  <form class="forgot" action="#sent" data-validate data-loading="Envoi…" novalidate>
    <header class="topbar">
      <a href="05-login.html" aria-label="Retour"><svg class="i"><use href="../assets/icons.svg#sol-arrow-left"/></svg></a>
    </header>
    <span class="empty__art"><svg class="i"><use href="../assets/icons.svg#sol-lock"/></svg></span>
    <h2>Mot de passe oublié ?</h2>
    <p>Indique l’adresse e-mail de ton compte : on t’envoie un lien pour en choisir un nouveau.</p>

    <label class="field field--icon-l">
      <svg class="i"><use href="../assets/icons.svg#sol-letter"/></svg>
      <input id="forgot-email" type="email" autocomplete="email" placeholder="Adresse e-mail" aria-label="E-mail" required data-error="Indique ton adresse e-mail" data-error-format="Cette adresse e-mail n’est pas valide">
    </label>

    <div class="sheet__cta">
      <button class="btn btn--block" type="submit">Recevoir le lien</button>
    </div>
  </form>

  <div class="modal" id="sent">
    <a class="modal__scrim" href="#" aria-label="Fermer"></a>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="sent-title">
      <svg class="i"><use href="../assets/icons.svg#sol-letter"/></svg>
      <h2 class="h3" id="sent-title">Regarde tes e-mails</h2>
      <p>Si un compte existe pour cette adresse, tu vas recevoir un lien pour choisir un nouveau mot de passe. Il reste valable 30 minutes.</p>
      <a class="btn btn--block" href="05-login.html">Retour à la connexion</a>
    </div>
  </div>

  <span class="home-indicator"></span>
</main>
<script src="../js/hush.js"></script>
</body>
</html>
